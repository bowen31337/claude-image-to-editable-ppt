[project]
name = "image-to-editable-ppt-cli"
version = "1.0.0"
description = "Self-contained editppt CLI for the image-to-editable-ppt skill."
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "openai>=2.0.0",
  "PyYAML>=6.0.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "resvg-py>=0.5.0",
  "opencv-python-headless>=4.8.0",
  "rapidocr>=3.0.0",
  "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
# Opt-in text-hints backend. Model weights use a modified OpenRAIL-M license:
# https://huggingface.co/datalab-to/indra-ocr/blob/main/LICENSE
indra = ["indra-ocr>=1.1.0"]

[project.scripts]
editppt = "editppt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editppt"]

[tool.hatch.build]
exclude = [
  "**/.DS_Store",
  "**/__pycache__",
]
